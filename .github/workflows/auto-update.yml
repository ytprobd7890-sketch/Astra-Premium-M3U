name: "🤖 #1 All Live Stream Links — Hourly"

on:
  schedule:
    # Every hour on the hour (UTC); GitHub may delay scheduled runs.
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'playlists/ULTIMATE_LIVE_*.m3u'
      - 'config.yaml'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/auto-update.yml'

permissions:
  contents: write

concurrency:
  group: all-live-stream-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test the checker
        run: python -m unittest discover -s tests -v

      - name: Check all streams and split live entries by server country
        env:
          BD_PROXY: ${{ secrets.BD_PROXY }}
        run: python src/main.py

      - name: Upload the live playlists
        uses: actions/upload-artifact@v4
        with:
          name: all-live-stream-links
          path: |
            playlists/FINAL_ULTIMATE_LIVE_CHECKED.m3u
            playlists/by_country/*.m3u
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push the live playlists
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Refusing to publish to a non-branch ref: $GITHUB_REF"
            exit 1
          fi
          git config user.name "Live Stream Bot"
          git config user.email "bot@astra-premium.local"
          git add -- playlists/FINAL_ULTIMATE_LIVE_CHECKED.m3u playlists/by_country
          if git diff --cached --quiet; then
            echo "No playlist changes to commit"
            exit 0
          fi
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "🤖 Hourly live stream check - $DATE"
          git push origin "HEAD:$GITHUB_REF"
