# Hourly all-live-stream checker
input:
  # The original playlist remains unchanged and is checked again every hour.
  file: "playlists/ULTIMATE_LIVE_5261.m3u"
  # Optional download only if the input file is missing.
  url: ""

output:
  # One playlist: every verified live entry, including duplicates.
  final_checked: "playlists/FINAL_ULTIMATE_LIVE_CHECKED.m3u"

checker:
  # Per attempt, including any HLS playlist and media probes.
  timeout: 8
  workers: 50
  retries: 1
  deep_check: true
  # Optional GitHub Actions secret / environment variable.
  proxy: "${BD_PROXY}"
  # One direct attempt if the proxy check fails.
  fallback_direct: true
